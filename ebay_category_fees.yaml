# =============================================================================
# EBAY GEBÜHREN NACH KATEGORIE-GRUPPE (eBay.de, Top-Shop/"Mit Shop"-Sätze)
# =============================================================================
# Quelle: eBay Gebührenseite (gescannt 23.06.2026) + Ankündigung Gebührenänderung
# ab 01.07.2026. Ersetzt die bisherige Pauschal-Annahme von 13% in config_shop2.yaml.
#
# rate_until / rate_from = Basissatz unterhalb der jeweiligen Schwelle (z.B.
# 6,5% bis 500€, 3% drüber). Die Schwelle selbst wird bewusst ignoriert, siehe
# ebay_fees.py - ab 1.7. sind die für uns relevanten Gruppen ohnehin flach,
# vorher betrifft die Staffel nur den Teil des Preises oberhalb der Schwelle.
# ponytail: Staffel-Restbetrag oberhalb der Schwelle ignoriert, exakte
# Zwei-Stufen-Berechnung nachbauen falls viele Artikel die Schwelle überschreiten.
#
# Business & Industrie (12576) hat exakt dieselben Sätze wie "standard" ->
# absichtlich kein eigener Eintrag, Root einfach mit in standard.group_roots.
fee_groups:
  geraete:
    name: "Geräte (Computer/Tablets&Netzwerk, Drucker, Foto, Handys, Haushaltsgeräte, TV/Audio, Konsolen, Scanner, Elektro-Pflege)"
    rate_until: 0.065   # bis 500€, danach 3% (Schwelle ignoriert)
    rate_from: 0.07
  zubehoer:
    name: "Zubehör (Kabel&Stecker, Notebook/Desktop-Zub., Tastaturen/Mäuse, Handy-Zub., TV-Audio-Zub., PC/Video-Zub., Kamera-Zub.)"
    rate_until: 0.11    # bis 200€, danach 3% (Schwelle ignoriert)
    rate_from: 0.12
  heimwerker:
    name: "Heimwerker"
    rate_until: 0.12    # bis 400€, danach 3% (Schwelle ignoriert)
    rate_from: 0.13
  garten:
    name: "Garten & Terrasse"
    rate_until: 0.12    # bis 200€, danach 3% (Schwelle ignoriert)
    rate_from: 0.13
  auto_teile:
    name: "Auto & Motorrad: Teile (bleibt ab 1.7. unverändert)"
    rate_until: 0.12    # bis 990€, danach 3% (Schwelle ignoriert)
    rate_from: 0.12
  standard:
    name: "Standard/Default (u.a. Business&Industrie, Haustierbedarf, Möbel&Wohnen, Büro&Schreibwaren, Baby, Beauty&Gesundheit, Sammeln, Spielzeug, Sport)"
    rate_until: 0.12    # bis 990€, danach 3% (Schwelle ignoriert)
    rate_from: 0.14
  medien:
    name: "Medien (Filme&Serien, Musik, Tickets, PC-&Videospiele, Bücher&Zeitschriften) - bleibt ab 1.7. unverändert"
    rate_until: 0.12
    rate_from: 0.12

default_group: standard   # Fallback wenn eine Kategorie-ID in keiner Gruppe gefunden wird

# eBay-Kategorie-ID-Wurzeln je Gruppe - direkt von der echten eBay-Gebührenseite
# UND der Änderungs-Ankündigung abgerufen und gegengeprüft (23.06.2026, siehe
# https://www.ebay.de/help/selling/fees-credits-invoices/... ?id=4809 und
# .../verkaeuferportal/news/seller-news/2026-juni/gebuehrenaenderungen).
# ebay_fees.py läuft für eine beliebige Kategorie-ID die Ancestor-Kette hoch
# (siehe ebay_category_ancestors.json) und nimmt die TIEFSTE (spezifischste)
# Übereinstimmung - z.B. liegt "Notebook-Zubehör" (Zubehör) selbst unter
# "Computer, Tablets & Netzwerk" (Geräte), aber Zubehör ist die spezifischere
# und damit richtige Zuordnung.
group_roots:
  geraete:    ["58058","1245","625","15032","20710","293","139971","11205","260783","260774","260773",
               "171833","18871","3323","96991","117045"]
  zubehoer:   ["171961","9394","182094","31530","3676","14961","54968","15200",
               "163769","48446","78997","30090","176970","56169"]
  heimwerker: ["3187"]
  garten:     ["159912"]
  auto_teile: ["131090"]
  medien:     ["11232","11233","1305","1249","267"]
  standard:   ["353","26395","260","2984","14339","14308","1281","9815","11700","1","220","888","12576"]

# Versiegelte Hygieneartikel (elektr. Zahn-/Mundpflege, Rasur, Haarstyling) -
# Widerrufsrecht entfällt nach Öffnen der Versiegelung (§312g Abs.2 Nr.3 BGB),
# nicht aber bei ungeöffneter Rücksendung. Eigene Mindestgewinn-Logik statt
# Retouren-Rücklage, siehe config_shop2.yaml::ebay_pricing.hygiene_min_profit_eur
# (Entscheidung Nutzer 24.06.2026, zuerst an Oral-B getestet).
hygiene_category_roots: ["260773", "260774", "260783", "26395"]
# 260773 Elektrische Haarstyling Geräte, 260774 Elektrische Mund-/Zahnpflege,
# 260783 Elektrische Rasur/Enthaarung — deckt Oral-B, Remington, Beurer etc.
# 26395 Beauty & Gesundheit als Catch-all für kosmetische/liquide Hygieneartikel
# (ghd Öle/Sprays, Desinfektionsgel) die nicht als Gerät eingestuft sind.
# ponytail: Falls je non-hygiene Artikel in Beauty&Gesundheit auftauchen, hier explizit excluden.
