name: Upload Tracking (BAB Mail → eBay)

# Liest BAB "Abliefernachweis"-Mails aus Gmail und lädt Tracking-Nummern
# automatisch zu eBay Sell Fulfillment API hoch.
# Läuft alle 30 Minuten — Käufer sehen Tracking binnen ~30 min nach BAB-Versand.

on:
  schedule:
    - cron: "*/30 * * * *"   # Alle 30 Minuten
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"
      days:
        description: "Mails der letzten N Tage (Standard: 7)"
        required: false
        default: "7"

concurrency:
  group: upload-tracking
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tracking hochladen
        env:
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EBAY_CLIENT_ID:       ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET:   ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          DAYS="${{ github.event.inputs.days || '7' }}"

          ARGS="--days $DAYS"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"

          echo "Starte: python upload_tracking.py $ARGS"
          python upload_tracking.py $ARGS

      - name: Ergebnis als Artifact speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-result-${{ github.run_number }}
          path: tracking_result.json
          retention-days: 7
