name: System Health Check

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC
    - cron: "0 12 * * *"   # 12:00 UTC
    - cron: "0 18 * * *"   # 18:00 UTC
    - cron: "0 0 * * *"    # 00:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ebay-health
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Health Check
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
        run: python system_health_check.py

      - name: Commit health_report.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/health_report.json
          if git diff --staged --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "chore: health check $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 3))
          done
          exit 1
