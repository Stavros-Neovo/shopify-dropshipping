name: Feedback Mailer

on:
  schedule:
    - cron: "0 9 * * *"    # Täglich 09:00 UTC (10/11 Uhr DE)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"
      days_min:
        description: "Mindest-Alter Bestellung in Tagen (Standard: 7)"
        required: false
        default: "7"
      days_max:
        description: "Max-Alter Bestellung in Tagen (Standard: 14)"
        required: false
        default: "14"

concurrency:
  group: feedback-mailer
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feedback Mailer ausführen
        env:
          EBAY_CLIENT_ID:       ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET:   ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          ARGS="$ARGS --days-min ${{ github.event.inputs.days_min || '7' }}"
          ARGS="$ARGS --days-max ${{ github.event.inputs.days_max || '14' }}"
          echo "Starte: python feedback_mailer.py $ARGS"
          python feedback_mailer.py $ARGS

      - name: State committen
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feedback_state.json || true
          git diff --staged --quiet || git commit -m "chore: feedback_state update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main || true
          git push || true
