name: Fix Product Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Was fixen? (promote / ipcstore / missing / all)"
        required: false
        default: "missing"
      limit:
        description: "Max Produkte (0 = alle)"
        required: false
        default: "0"

concurrency:
  group: ebay-background   # Hintergrund — blockiert nie Sync oder Repricing
  cancel-in-progress: false

jobs:
  fix-images:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore icecat cache
        uses: actions/cache@v4
        with:
          path: icecat_cache.json
          key: icecat-cache-${{ github.run_id }}
          restore-keys: |
            icecat-cache-

      # ── Step 1: images_all[0] → image_main ───────────────────────────────
      - name: Step 1 – Promote images_all → image_main
        if: ${{ github.event.inputs.mode == 'promote' || github.event.inputs.mode == 'all' }}
        run: |
          python3 - <<'PYEOF'
          import csv, shutil
          ENRICHMENT_FILE = "enrichment_index.csv"
          shutil.copy2(ENRICHMENT_FILE, "enrichment_index_backup.csv")
          with open(ENRICHMENT_FILE, encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              fieldnames = list(reader.fieldnames or [])
              rows = list(reader)
          promoted = 0
          for row in rows:
              if not (row.get("image_main") or "").strip() and (row.get("images_all") or "").strip():
                  first = row["images_all"].split("|")[0].strip()
                  if first:
                      row["image_main"] = first
                      promoted += 1
          with open(ENRICHMENT_FILE, "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)
          print(f"✓ Promoted {promoted} images_all[0] -> image_main")
          PYEOF

      # ── Step 2: ipcstore → Icecat/DDG (erste Runde) ───────────────────────
      - name: Step 2 – Replace ipcstore images (Icecat + DDG)
        if: ${{ github.event.inputs.mode == 'ipcstore' || github.event.inputs.mode == 'all' }}
        timeout-minutes: 75
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "$LIMIT" = "0" ]; then
            python3 fix_ipcstore_images.py --no-validate
          else
            python3 fix_ipcstore_images.py --no-validate --limit "$LIMIT"
          fi

      # ── Step 3: verbleibende ipcstore → Amazon + barcodelookup + DDG-EAN ──
      - name: Step 3 – Fix remaining ipcstore images (multi-source)
        if: ${{ github.event.inputs.mode == 'missing' || github.event.inputs.mode == 'all' }}
        timeout-minutes: 80
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "$LIMIT" = "0" ]; then
            python3 fix_missing_images_v2.py
          else
            python3 fix_missing_images_v2.py --limit "$LIMIT"
          fi

      # ── Cache speichern ───────────────────────────────────────────────────
      - name: Save icecat cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: icecat_cache.json
          key: icecat-cache-${{ github.run_id }}

      # ── Analyse ───────────────────────────────────────────────────────────
      - name: Analyse result
        if: always()
        run: |
          python3 - <<'PYEOF'
          import csv
          with open("enrichment_index.csv", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          no_img = sum(1 for r in rows if not (r.get("image_main") or "").strip())
          ipc    = sum(1 for r in rows if "ipcstore" in (r.get("image_main") or "").lower())
          total  = len(rows)
          ok     = total - no_img - ipc
          print(f"=== BILD-STATUS ===")
          print(f"  Gesamt:            {total}")
          print(f"  Gutes Bild:        {ok}  ({ok*100//total}%)")
          print(f"  ipcstore (fehlt):  {ipc}")
          print(f"  Kein Bild:         {no_img}")
          PYEOF

      # ── Commit ────────────────────────────────────────────────────────────
      - name: Commit updated enrichment_index.csv
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add enrichment_index.csv icecat_cache.json || true
          git diff --staged --stat
          git diff --staged --quiet || git commit -m "fix: update product images (multi-source fix)"
          git pull --rebase origin main || true
          git push
