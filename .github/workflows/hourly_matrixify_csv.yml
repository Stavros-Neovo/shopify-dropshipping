on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ebay-sync   # KRITISCH — läuft immer, wird von nichts blockiert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Matrixify CSV
        run: python build_matrixify_csv.py

      - name: Commit and push CSV
        if: always()
        run: |
          mkdir -p docs
          cp public/shopify_products.csv docs/shopify_products.csv 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/shopify_products.csv state.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update shopify_products.csv [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 3))
          done
          exit 1
