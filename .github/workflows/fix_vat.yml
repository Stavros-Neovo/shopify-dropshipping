name: Fix VAT (einmalig)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"

jobs:
  fix-vat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: MwSt auf alle Angebote setzen
        env:
          EBAY_CLIENT_ID:     ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS=""
          [ "$DRY" = "true" ] && ARGS="--dry-run"
          python fix_vat.py $ARGS
