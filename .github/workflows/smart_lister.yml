name: Smart Lister

on:
  schedule:
    - cron: "0 2 * * *"      # Täglich 02:00 UTC — Score-Cache aktualisieren
    - cron: "0 3 * * 1"      # Montags 03:00 UTC — Top-Artikel neu auswählen
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = Cache, select = Auswahl, both = beides"
        required: false
        default: "both"
      top:
        description: "Anzahl Artikel (Standard: 2300)"
        required: false
        default: "2300"
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"
      list_products:
        description: "Artikel auf eBay listen? (true/false)"
        required: false
        default: "false"
      limit:
        description: "Max API-Calls pro Run (Standard: 1200)"
        required: false
        default: "1200"

concurrency:
  group: smart-lister
  cancel-in-progress: false

jobs:
  smart-lister:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lieferanten-CSVs herunterladen
        env:
          BAB_URL:     ${{ secrets.BAB_PRICELIST_URL }}
          KOSATEC_URL: ${{ secrets.KOSATEC_PRICELIST_URL }}
        run: |
          curl -fL "$BAB_URL" -o bab_preisliste.csv
          curl -fL "$KOSATEC_URL" -o kosatec_preisliste.csv
          echo "BAB: $(wc -l < bab_preisliste.csv) Zeilen"
          echo "Kosatec: $(wc -l < kosatec_preisliste.csv) Zeilen"

      - name: Cache-Status prüfen
        run: |
          if [ -f ebay_score_cache.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('ebay_score_cache.json'))))" 2>/dev/null || echo "?")
            echo "Cache im Repo: $COUNT EANs gecacht"
          else
            echo "Kein Cache im Repo — starte frisch"
          fi

      - name: Smart Lister ausführen
        env:
          EBAY_CLIENT_ID:     ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TOP="${{ github.event.inputs.top || '2300' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          LIMIT="${{ github.event.inputs.limit || '4800' }}"

          # Schedule: täglich nur scan, montags beides
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DOW=$(date -u +%u)
            if [ "$DOW" = "1" ]; then MODE="both"; else MODE="scan"; fi
            LIMIT="4800"
          fi

          # Argumente aufbauen
          ARGS="--limit $LIMIT"
          [ "$MODE" = "scan" ] || [ "$MODE" = "both" ] && ARGS="$ARGS --scan"
          [ "$MODE" = "select" ] || [ "$MODE" = "both" ] && ARGS="$ARGS --select --top $TOP"
          [ "${{ github.event.inputs.list_products }}" = "true" ] && ARGS="$ARGS --list"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"

          echo "Starte: python smart_lister.py $ARGS"
          python smart_lister.py $ARGS

      - name: Cache ins Repo committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ebay_score_cache.json || true
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            git add supplier_map.json || true
          fi
          git diff --staged --quiet || git commit -m "chore: smart_lister cache $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push || true
