name: Smart Lister

on:
  schedule:
    - cron: "0 2 * * *"      # 02:00 UTC — Scan + Select + List
    - cron: "0 8 * * *"      # 08:00 UTC — Select + List (Preisänderungen morgens)
    - cron: "0 14 * * *"     # 14:00 UTC — Scan + Select + List
    - cron: "0 20 * * *"     # 20:00 UTC — Select + List (Abend)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = Cache, select = Auswahl, both = beides"
        required: false
        default: "both"
      top:
        description: "Anzahl Artikel (Standard: 2300)"
        required: false
        default: "2300"
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"
      list_products:
        description: "Artikel auf eBay listen? (true/false)"
        required: false
        default: "false"
      bab_only:
        description: "Nur BAB-Artikel (Kosatec überspringen)? (true/false)"
        required: false
        default: "true"
      limit:
        description: "Max API-Calls pro Run (Standard: 1200)"
        required: false
        default: "1200"

concurrency:
  group: smart-lister
  cancel-in-progress: false

jobs:
  smart-lister:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lieferanten-CSVs herunterladen
        env:
          BAB_URL:     ${{ secrets.BAB_PRICELIST_URL }}
          KOSATEC_URL: ${{ secrets.KOSATEC_PRICELIST_URL }}
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL "$BAB_URL" -o bab_preisliste.csv
          curl -fL "$KOSATEC_URL" -o kosatec_preisliste.csv
          echo "BAB: $(wc -l < bab_preisliste.csv) Zeilen"
          echo "Kosatec: $(wc -l < kosatec_preisliste.csv) Zeilen"
          gh release download static-data-v1 -p "artikeldaten.csv" --clobber
          echo "Artikeldaten: $(wc -l < artikeldaten.csv) Zeilen"

      - name: Cache-Status prüfen
        run: |
          if [ -f ebay_score_cache.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('ebay_score_cache.json'))))" 2>/dev/null || echo "?")
            echo "Cache im Repo: $COUNT EANs gecacht"
          else
            echo "Kein Cache im Repo — starte frisch"
          fi

      - name: Smart Lister ausführen
        env:
          EBAY_CLIENT_ID:     ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TOP="${{ github.event.inputs.top || '2300' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          LIMIT="${{ github.event.inputs.limit || '4800' }}"
          BAB_ONLY="${{ github.event.inputs.bab_only || 'true' }}"

          # Schedule: 02:00 + 14:00 → scan+select+list, 08:00 + 20:00 → select+list
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "02" ] || [ "$HOUR" = "14" ]; then
              MODE="both"
              LIMIT="4800"
            else
              MODE="select"
              LIMIT="0"
            fi
            BAB_ONLY="true"   # Schedule läuft immer nur mit BAB
          fi

          # Argumente aufbauen
          ARGS="--limit $LIMIT"
          [ "$MODE" = "scan" ]   || [ "$MODE" = "both" ] && ARGS="$ARGS --scan"
          [ "$MODE" = "select" ] || [ "$MODE" = "both" ] && ARGS="$ARGS --select --top $TOP"
          # Schedule läuft immer mit --list; manuell nur wenn list_products=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "$MODE" = "select" ] || [ "$MODE" = "both" ] && ARGS="$ARGS --list"
          else
            [ "${{ github.event.inputs.list_products }}" = "true" ] && ARGS="$ARGS --list"
          fi
          [ "$BAB_ONLY" = "true" ] && ARGS="$ARGS --bab-only"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"

          echo "Starte: python smart_lister.py $ARGS"
          python smart_lister.py $ARGS

      - name: Cache ins Repo committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Unstaged changes sichern vor pull
          git stash --include-untracked 2>/dev/null || true

          # Stage Cache + supplier_map (immer, außer dry-run)
          git stash pop 2>/dev/null || true
          git add ebay_score_cache.json 2>/dev/null || true
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            git add supplier_map.json 2>/dev/null || true
          fi

          # Nur committen wenn es Änderungen gibt
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig"
            exit 0
          fi

          CHANGED=$(git diff --staged --name-only | tr '\n' ' ')
          git commit -m "chore: smart_lister $(date -u '+%Y-%m-%d %H:%M') UTC — $CHANGED[skip ci]"

          # Push mit Retry-Loop (3 Versuche bei Konflikten)
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push erfolgreich (Versuch $attempt)"
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt) — pull + retry..."
            git stash --include-untracked 2>/dev/null || true
            git pull --rebase origin main || true
            git stash pop 2>/dev/null || true
            git add ebay_score_cache.json 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo "✗ Push nach 3 Versuchen fehlgeschlagen"
          exit 1
