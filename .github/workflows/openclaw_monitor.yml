name: OpenClaw — System Monitor

# Täglicher Systemcheck: prüft alle Workflows, Listings, Fehler und gibt
# eine Zusammenfassung aus, die als GitHub Actions Summary sichtbar ist.

on:
  schedule:
    - cron: "0 7 * * *"    # Täglich 07:00 UTC (09:00 MEZ)
  workflow_dispatch:

concurrency:
  group: openclaw-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv --break-system-packages 2>/dev/null || pip install requests python-dotenv

      - name: System-Check durchführen
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:       ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, csv, requests
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          TOKEN = os.getenv("GH_TOKEN", "")
          REPO  = os.getenv("GH_REPO", "stavros-neovo/shopify-dropshipping")
          NOW   = datetime.now(timezone.utc)

          headers = {"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json"}

          issues = []
          ok_list = []

          # ─── 1. Workflow-Status ────────────────────────────────────────────
          workflows = {
              "smart_lister.yml":          "📦 Smart Lister (Listing)",
              "deactivate_zero_stock.yml": "🔴 Deaktivierung (Stock=0)",
              "upload_tracking.yml":       "📬 Tracking Upload",
              "enrich_descriptions.yml":   "📝 Beschreibungs-Anreicherung",
          }

          wf_status = {}
          try:
              r = requests.get(f"https://api.github.com/repos/{REPO}/actions/runs?per_page=50", headers=headers, timeout=15)
              runs = r.json().get("runs", [])
              for wf_file, wf_name in workflows.items():
                  matching = [run for run in runs if run.get("path","").endswith(wf_file)]
                  if matching:
                      last = matching[0]
                      status = last.get("conclusion") or last.get("status","unknown")
                      age_h = (NOW - datetime.fromisoformat(last["updated_at"].replace("Z","+00:00"))).total_seconds() / 3600
                      wf_status[wf_file] = {"name": wf_name, "status": status, "age_h": age_h, "url": last.get("html_url","")}
                      if status == "failure":
                          issues.append(f"❌ {wf_name} → letzter Run FEHLGESCHLAGEN (vor {age_h:.1f}h)")
                      elif status == "success":
                          ok_list.append(f"✅ {wf_name} ({age_h:.1f}h ago)")
                      else:
                          ok_list.append(f"⏳ {wf_name}: {status}")
                  else:
                      issues.append(f"⚠️ {wf_name} → Noch kein Run gefunden")
          except Exception as e:
              issues.append(f"⚠️ Workflow-Check Fehler: {e}")

          # ─── 2. supplier_map.json ─────────────────────────────────────────
          try:
              sm = json.loads(Path("supplier_map.json").read_text(encoding="utf-8"))
              active = sum(1 for v in sm.values() if v.get("active"))
              inactive = len(sm) - active
              zero_stock = sum(1 for v in sm.values() if v.get("active") and v.get("stock", 1) == 0)
              ok_list.append(f"✅ supplier_map: {active} aktiv / {inactive} inaktiv / {zero_stock} mit Stock=0")
              if zero_stock > 10:
                  issues.append(f"⚠️ {zero_stock} aktive Listings haben Stock=0 — Deaktivierung ausstehend?")
          except Exception as e:
              issues.append(f"⚠️ supplier_map.json Fehler: {e}")

          # ─── 3. enrichment_index.csv ──────────────────────────────────────
          try:
              rows = list(csv.DictReader(open("enrichment_index.csv", encoding="utf-8-sig")))
              with_desc = sum(1 for r in rows if r.get("long_summary","").strip())
              total = len(rows)
              pct = with_desc / total * 100 if total else 0
              ok_list.append(f"✅ enrichment_index: {with_desc}/{total} mit Beschreibung ({pct:.1f}%)")
              if pct < 30:
                  issues.append(f"⚠️ Nur {pct:.1f}% der Artikel haben Beschreibungen → Icecat-Anreicherung prüfen")
          except Exception as e:
              issues.append(f"⚠️ enrichment_index.csv Fehler: {e}")

          # ─── 4. tracking_result.json (falls vorhanden) ───────────────────
          try:
              tr = json.loads(Path("tracking_result.json").read_text())
              ok_count = tr.get("ok", 0)
              err_count = tr.get("error", 0)
              ran_at = tr.get("ran_at", "?")[:16]
              ok_list.append(f"✅ Tracking: {ok_count} hochgeladen, {err_count} Fehler (letzter Run: {ran_at})")
              if err_count > 0:
                  issues.append(f"⚠️ Tracking: {err_count} Fehler beim letzten Upload")
          except:
              ok_list.append("ℹ️ tracking_result.json noch nicht vorhanden (kein Run)")

          # ─── 5. GitHub Actions Summary schreiben ──────────────────────────
          summary_file = os.getenv("GITHUB_STEP_SUMMARY", "/tmp/summary.md")
          with open(summary_file, "w", encoding="utf-8") as f:
              date_str = NOW.strftime("%d.%m.%Y %H:%M UTC")
              f.write(f"# 🦅 OpenClaw Monitor — {date_str}\n\n")

              if issues:
                  f.write("## ⚠️ Probleme gefunden\n\n")
                  for issue in issues:
                      f.write(f"- {issue}\n")
                  f.write("\n")
              else:
                  f.write("## ✅ Alle Systeme OK\n\n")

              f.write("## Status-Übersicht\n\n")
              for item in ok_list:
                  f.write(f"- {item}\n")

              f.write("\n## Workflow-Details\n\n")
              f.write("| Workflow | Status | Zuletzt |\n")
              f.write("|----------|--------|----------|\n")
              for wf_file, info in wf_status.items():
                  icon = "✅" if info["status"] == "success" else "❌" if info["status"] == "failure" else "⏳"
                  f.write(f"| {info['name']} | {icon} {info['status']} | vor {info['age_h']:.1f}h |\n")

              f.write(f"\n---\n*OpenClaw v1.0 — Best_Neodeals Systemkontrolle*\n")

          # Exit-Code setzen wenn Probleme vorhanden
          if issues:
              print(f"⚠️ WARNUNG: {len(issues)} Problem(e) gefunden:")
              for i in issues:
                  print(f"  {i}")
              exit(1)
          else:
              print(f"✅ Alle Systeme OK — {len(ok_list)} Checks bestanden")

          PYEOF

      - name: Ergebnis-Artifact speichern
        if: always()
        run: |
          echo "{\"ran_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"${{ job.status }}\"}" > openclaw_result.json

      - name: Artifact hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-report-${{ github.run_number }}
          path: openclaw_result.json
          retention-days: 30
