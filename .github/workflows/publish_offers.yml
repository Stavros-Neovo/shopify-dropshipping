name: Offers publishen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true = nur zeigen, nichts publishen)"
        required: false
        default: "true"
      all:
        description: "Auch Offers ohne Bild versuchen? (true/false)"
        required: false
        default: "false"

concurrency:
  group: ebay-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publish_offers.py
        env:
          EBAY_CLIENT_ID:       ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET:   ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
          CSV_HTTP_USER:        ${{ secrets.CSV_HTTP_USER }}
          CSV_HTTP_PASSWORD:    ${{ secrets.CSV_HTTP_PASSWORD }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true"  ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.all }}"     = "true"  ] && ARGS="$ARGS --all"
          python publish_offers.py $ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-report-${{ github.run_id }}
          path: publish_report.csv
          retention-days: 30
