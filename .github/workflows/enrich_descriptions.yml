name: Enrich Descriptions (Icecat + Claude)

# Holt Produktbeschreibungen von Icecat per EAN und verbessert sie optional mit Claude KI.
# Ergebnis wird in enrichment_index.csv gespeichert.
# Beim nächsten smart_lister --list Run werden die Beschreibungen automatisch an eBay übertragen.

on:
  schedule:
    - cron: "0 1 * * *"    # Täglich 01:00 UTC (vor smart_lister 02:00)
  workflow_dispatch:
    inputs:
      all:
        description: "Alle Artikel erneuern (auch vorhandene)? (true/false)"
        required: false
        default: "false"
      limit:
        description: "Max Artikel pro Run (Standard: 200)"
        required: false
        default: "200"
      dry_run:
        description: "Dry-run? (true/false)"
        required: false
        default: "false"

concurrency:
  group: enrich-descriptions
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Beschreibungen anreichern
        env:
          ICECAT_USER:       ${{ secrets.ICECAT_USER }}
          ICECAT_PASS:       ${{ secrets.ICECAT_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ALL="${{ github.event.inputs.all || 'false' }}"
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"

          ARGS="--limit $LIMIT"
          [ "$ALL" = "true" ] && ARGS="$ARGS --all"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"

          echo "Starte: python enrich_descriptions.py $ARGS"
          python enrich_descriptions.py $ARGS

      - name: enrichment_index.csv committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add enrichment_index.csv 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi

          CHANGED=$(git diff --staged --stat enrichment_index.csv | tail -1)
          git commit -m "feat: enrich_descriptions $(date -u '+%Y-%m-%d') — $CHANGED [skip ci]"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push (Versuch $attempt)"
              exit 0
            fi
            git pull --no-rebase origin main || true
            sleep $((attempt * 2))
          done
          exit 1
