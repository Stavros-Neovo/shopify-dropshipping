name: Hourly Shopify + eBay Sync

# Läuft stündlich (Minute 5 jeder Stunde) plus manuell auf Knopfdruck
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache: state.json + processed_orders + tracked_shipments
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            state.json
            state_shop2.json
            processed_orders_state.json
            processed_orders_state_shop2.json
            tracked_shipments_state.json
            tracked_shipments_state_shop2.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-
            shopify-state-

      - name: Run all (sync + orders + tracking)
        env:
          # Shopify
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          # BAB Feed
          CSV_HTTP_USER: ${{ secrets.CSV_HTTP_USER }}
          CSV_HTTP_PASSWORD: ${{ secrets.CSV_HTTP_PASSWORD }}
          # eBay API – Shop 1
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          # eBay API – Shop 2
          EBAY_REFRESH_TOKEN_2: ${{ secrets.EBAY_REFRESH_TOKEN_2 }}
          # SMTP (Bestellmails senden)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # IMAP (Tracking-Mails lesen) – falls abweichend von SMTP
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: make all

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            state_shop2.json
            processed_orders_state.json
            processed_orders_state_shop2.json
            tracked_shipments_state.json
            tracked_shipments_state_shop2.json
          key: sync-state-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
