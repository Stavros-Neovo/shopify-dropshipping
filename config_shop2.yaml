# =============================================================================
# SHOP 2 – KONFIGURATION (25% Fix-Marge eBay)
# =============================================================================
# Gleicher BAB-Feed wie Shop 1, aber eigener eBay Account + feste 25% Marge.
#
# Aufruf: python sync.py --config config_shop2.yaml --live
# =============================================================================

# -----------------------------------------------------------------------------
# CSV-QUELLE (identisch mit Shop 1)
# -----------------------------------------------------------------------------
csv:
  url: "https://pricelist.bab-distribution.de/50429_a2Q2yGHHkSgMe4BV"
  delimiter: ";"
  encoding: "utf-8-sig"
  columns:
    sku: "ItemNo"
    title: "Description"
    description: "Description"
    purchase_price: "Price_B2B"
    stock: "Stock"
    weight_kg: "GrossWeight"
    image_url: ""
    ean: "GTIN"
    category: "ItemMainGroup"
    brand: "ManufacturerName"

# -----------------------------------------------------------------------------
# SHOPIFY PRICING (Shop 2 hat keinen eigenen Shopify — wird ignoriert)
# -----------------------------------------------------------------------------
pricing:
  vat_rate: 0.19
  tiers:
    - ek_max: 999999.0
      markup: 0.25
  min_absolute_margin_eur: 5.00
  shipping_buffer:
    - ek_max: 999999.0
      buffer_eur: 0.00
  rounding_strategy: "psychological_99"

# -----------------------------------------------------------------------------
# FILTER (identisch mit Shop 1)
# -----------------------------------------------------------------------------
filters:
  max_weight_kg: 50.0
  min_stock: 1
  max_purchase_price_eur: 500.0
  allowed_categories: []
  excluded_keywords:
    - "Apple"
    - "iPhone"
    - "Samsung Galaxy"
    - "AirPods"

# -----------------------------------------------------------------------------
# VERSAND
# -----------------------------------------------------------------------------
shipping:
  flat_rate_eur: 4.99
  free_shipping_threshold_eur: 0

# -----------------------------------------------------------------------------
# SHOPIFY API (deaktiviert — Shop 2 ist nur eBay)
# -----------------------------------------------------------------------------
shopify:
  shop_domain: ""   # leer lassen → Shopify wird übersprungen
  api_version: "2024-10"
  location_id: ""

# -----------------------------------------------------------------------------
# EBAY PRICING – FIXE 25% MARGE
# Formel: VK_brutto = (EK + 5€ Versand + EK × 25%) × 1.19 ÷ (1 − 0.13)
# -----------------------------------------------------------------------------
ebay_pricing:
  shipping_cost_eur: 5.00        # Was wir dem Spediteur zahlen
  buyer_shipping_eur: 0.00       # Kostenloser Versand (UPS STD) - Käufer zahlt nichts extra, siehe Fulfillment-Policy 257236926010. War fälschlich 3,99€ -> hat Floor/VK systematisch ca. 4€ zu niedrig kalkuliert (23.06.2026 gefunden).
  ebay_fee_rate: 0.13
  campaign_fee_rate: 0.0         # Promoted Listings deaktiviert (20.06.2026) - war 0.08
  vat_rate: 0.19

  # Margen-Staffel nach EK: je teurer der Artikel, desto niedriger der Prozentsatz
  # (absoluter Gewinn bleibt ordentlich, aber wir bleiben bei teuren Artikeln
  # konkurrenzfähig). margin = Zielpreis (Normalpreis), floor_margin = absoluter
  # Boden, unter den repricer.py niemals geht (siehe MIN_MARGIN_PCT-Ablösung dort).
  margin_tiers:
    - ek_max: 30.0
      margin: 0.30
      floor_margin: 0.25
    - ek_max: 100.0
      margin: 0.25
      floor_margin: 0.20
    - ek_max: 300.0
      margin: 0.20
      floor_margin: 0.15
    - ek_max: 999999.0
      margin: 0.15
      floor_margin: 0.10

  # Retouren-Rücklage: BAB hat kein Rückgaberecht für uns, eBay-Kunden aber
  # 14 Tage Widerrufsrecht (Fernabsatzrecht) - jede Rücksendung ist ein
  # kompletter EK-Verlust. 5% auf EK eingepreist, bis echte Retourenquote vorliegt.
  return_reserve_rate: 0.05

  min_margin_eur: 5.00
  rounding_strategy: "psychological_99"

  # Versiegelte Hygieneartikel (elektr. Zahn-/Mundpflege, Rasur, Haarstyling -
  # siehe ebay_fees.is_hygiene_category): Widerruf entfällt nach Öffnen
  # (§312g Abs.2 Nr.3 BGB), nicht aber bei ungeöffneter Rücksendung - daher
  # 0% Retouren-Rücklage statt 5%, UND fester Mindestgewinn statt %-Marge,
  # um "auf Masse" konkurrenzfähig nah an den Mitbewerber zu kommen.
  # Entscheidung Nutzer 24.06.2026, zuerst an Oral-B getestet.
  hygiene_min_profit_eur: 1.00  # so aggressiv wie möglich (deckt eBay-Fixgebühr 0,35-0,45€)

# -----------------------------------------------------------------------------
# EBAY API – SHOP 2 (eigener Seller Account)
# -----------------------------------------------------------------------------
ebay:
  marketplace_id: "EBAY_DE"
  sandbox: false

  # Business-Policies Shop 2
  fulfillment_policy_id: "257236926010"   # UPS STD
  payment_policy_id: "257236921010"       # Payment
  return_policy_id: "257236922010"        # Rücknahme

  # Merchant Location (wird automatisch angelegt)
  merchant_location_key: "hauptlager_shop2"

  merchant_location_address:
    name: "Neovogen"
    address1: "Bismarckstr. 91"
    city: "Düsseldorf"
    postal_code: "40210"
    country: "DE"

  # Refresh Token: EBAY_REFRESH_TOKEN_2 aus .env (Shop 2 Account)
  refresh_token_env_var: "EBAY_REFRESH_TOKEN_2"

  enabled: true

# -----------------------------------------------------------------------------
# LIEFERANT (Bestellmail an BAB)
# -----------------------------------------------------------------------------
supplier_email:
  to: "SSchulze@bab-distribution.de"   # ← echte Email von Sebastian eintragen
  from_name: "eBay Shop 2"
  language: "de"
  auto_send: true

# -----------------------------------------------------------------------------
# LAUFZEIT
# -----------------------------------------------------------------------------
runtime:
  dry_run: true
  max_products_per_run: 250
  log_dir: "logs"
  state_file: "state_shop2.json"   # eigene State-Datei! nicht mit Shop 1 mischen
